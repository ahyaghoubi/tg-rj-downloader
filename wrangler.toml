name = "telegram-radiojavan"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Required secrets (set before deploying):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put JOB_RUNNER_SECRET
#
# Optional secrets:
#   npx wrangler secret put RJ_API_KEY
#   npx wrangler secret put RJ_USER_AGENT

# Reusable Telegram audio cache (file_id reuse). Optional but recommended.
# Create with: npx wrangler kv namespace create TELEGRAM_FILE_CACHE
[[kv_namespaces]]
binding = "TELEGRAM_FILE_CACHE"
id = "62022af1fd724b10a4d6921c84f0e99d"

# Queue chat locks, cancel flags, recents, and callback spill.
# Create with: npx wrangler kv namespace create ARTIST_JOB_STORE
[[kv_namespaces]]
binding = "ARTIST_JOB_STORE"
id = "1302c1b36a434ec6bb93a89f540232da"

[[queues.producers]]
binding = "ARTIST_QUEUE"
queue = "telegram-radiojavan-artist-delivery"

[[queues.consumers]]
queue = "telegram-radiojavan-artist-delivery"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "telegram-radiojavan-artist-delivery-dlq"

# Inspect stalled artist deliveries that exhausted retries.
[[queues.consumers]]
queue = "telegram-radiojavan-artist-delivery-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 1
max_concurrency = 1

[vars]
ARTIST_QUEUE_DELAY_SECONDS = "1"
MAX_AUDIO_URL_ATTEMPTS = "3"
ARTIST_PROGRESS_EVERY = "5"
DEFAULT_DAILY_DOWNLOAD_LIMIT = "80"
ADMIN_USER_IDS = "224032101"
